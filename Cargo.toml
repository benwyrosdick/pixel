[package]
name = "pixel"
version = "0.1.0"
edition = "2021"
description = "A photo editor for Omarchy"
license = "MIT"
publish = false

[lib]
name = "pixel"
path = "src/lib.rs"

[[bin]]
name = "pixel"
path = "src/main.rs"

[dependencies]
cairo-rs = "0.22"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
imageproc = { version = "0.25.1", default-features = false }
pango = "0.22"
pangocairo = "0.22"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[dependencies.gtk]
package = "gtk4"
version = "0.11"
features = ["v4_14"]

[dependencies.libadwaita]
version = "0.9"
features = ["v1_5", "gtk_v4_10"]

[dependencies.toml]
version = "0.8"
